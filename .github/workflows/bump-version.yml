name: Bump version

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: SemVer bump to apply
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump package version and tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, and tag
        id: version
        run: |
          set -euo pipefail

          npm version "${{ inputs.version_bump }}" --no-git-tag-version
          new_version="$(node -p "require('./package.json').version")"
          tag="v${new_version}"

          git add package.json package-lock.json
          git commit -m "chore(release): ${tag}"
          git tag "${tag}"

          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push origin "HEAD:${{ github.ref_name }}" "${{ steps.version.outputs.tag }}"
