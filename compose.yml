services:
  pi-web:
    build:
      context: .
      args:
        UV_VERSION: ${UV_VERSION:-0.11.26}
        PYTHON_VERSION: ${PYTHON_VERSION:-}
        RUST_VERSION: ${RUST_VERSION:-1}
    ports:
      - "127.0.0.1:30141:30141"
    environment:
      HOST: 0.0.0.0
      PORT: 30141
      WORKSPACE_ROOT: /workspace
      PI_WEB_DATA_DIR: /home/node/.pi/agent/pi-web
      HOME: /home/node
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - ./data/pi/agent:/home/node/.pi/agent
      - ./data/workspace:/workspace
